services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vireqo
      POSTGRES_USER: vireqo
      POSTGRES_PASSWORD: vireqo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - vireqo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vireqo -d vireqo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vireqo_postgres:
